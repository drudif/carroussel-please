<meta charset="utf-8">
<title>catálogo</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{--papel:#F4F0E6;--tinta:#141414;--azul:#0F5FA6;--laranja:#E0521C;
      --fraco:#8A8378;--linha:#CFC7B6}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--papel);color:var(--tinta);font-family:'Mono',ui-monospace,monospace;
     width:1600px;padding:66px 64px 56px}

.top{display:flex;justify-content:space-between;align-items:flex-end;
     border-bottom:5px solid var(--tinta);padding-bottom:16px;margin-bottom:34px}
h1{font-family:'Tit';font-size:70px;line-height:.9;letter-spacing:-.01em}
h1 i{font-style:normal;color:var(--fraco)}
.sub{font-size:15.5px;line-height:1.5;max-width:600px;text-align:right;color:#3A362F}
.sub b{font-weight:400;border-bottom:2px solid var(--tinta)}

.faixa{margin-bottom:14px}
.faixa-cab{display:flex;align-items:baseline;gap:16px;padding:16px 0 12px;
           border-top:2.5px solid var(--tinta);margin-top:26px}
.faixa-cab h2{font-family:'Tit';font-size:29px;line-height:1}
.faixa-cab span{font-size:14px;line-height:1.45;color:#3A362F;max-width:820px}
.faixa.aviso .faixa-cab{border-top-color:var(--laranja)}
.faixa.aviso .faixa-cab h2{color:var(--laranja)}

.est{display:grid;grid-template-columns:330px 1fr;gap:30px;align-items:start;
     padding:20px 0;border-bottom:1.5px solid var(--linha)}
.est:last-child{border-bottom:none}
.num{font-family:'Tit';font-size:56px;line-height:.8;color:var(--tinta);float:left;
     margin-right:14px}
.nome{font-family:'Tit';font-size:31px;line-height:1;margin-bottom:7px}
.linha1{font-size:14.5px;line-height:1.5;color:#26231E}
.linha1 b{font-weight:400;background:rgba(15,95,166,.11);padding:1px 5px}
.linha1 em{font-style:normal;color:var(--fraco)}
.refs{display:flex;gap:14px}
.refs figure{flex:1}
.refs img{width:100%;aspect-ratio:1080/1341;object-fit:cover;display:block;
          border:1.5px solid var(--linha);background:#E8E3D8}
.refs figcaption{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
                 color:var(--fraco);margin-top:6px}

.propria{border:2px dashed var(--fraco);padding:20px 24px;margin-top:34px;
         font-size:15px;line-height:1.55;color:#26231E}
.propria b{font-weight:400;font-family:'Tit';font-size:22px;display:block;margin-bottom:6px}

.cta{background:var(--tinta);color:var(--papel);padding:26px 30px;margin-top:22px;
     display:flex;justify-content:space-between;align-items:center;gap:30px}
.cta .g{font-family:'Tit';font-size:38px;line-height:1.05}
.cta .p{font-size:14.5px;line-height:1.5;color:#C9C1B4;max-width:520px;text-align:right}
.pe{display:flex;justify-content:space-between;margin-top:26px;padding-top:13px;
    border-top:1.5px solid var(--linha);font-size:12px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--fraco)}
</style>
<div id="root"></div>
<script>
const REF = e => [1,2,3].map((n,i)=>{
  const arq = ['split','cascata','bento'][i];
  return `<figure><img src="refs/${e}-${n}-${arq}.jpg"><figcaption>${arq}</figcaption></figure>`;
}).join('');

const est = (n, chave, nome, linha) => `<div class="est">
  <div><div class="num">${n}</div><div class="nome">${nome}</div>
    <div class="linha1">${linha}</div></div>
  <div class="refs">${REF(chave)}</div></div>`;

const PROPRIA = `<div class="propria"><b>Ou a sua própria referência</b>
  Se você já tem uma peça que te agradou — um post, um cartaz, um print, um PDF —, me manda.
  Eu leio e te digo de qual desses sete ela está mais perto, e confirmo com você antes de seguir.
  <em style="font-style:normal;color:#8A8378"> Ela escolhe entre os sete e afina o escolhido; não
  vira um oitavo estilo — direção inventada na hora sai bonita na capa e quebra no card 5.</em></div>`;

const CTA = `<div class="cta">
  <div class="g">Escreva o número<br>da opção que você prefere.</div>
  <div class="p">É só o número — ele é do estilo, não da posição na lista, então vale igual em
    qualquer conversa. Ficou dividido entre dois? Escreva os dois: eu mostro os seis lado a
    lado e a gente desempata olhando.</div></div>`;

const A = `
<div class="top"><h1>catálogo<i>.</i></h1>
  <div class="sub"><b>Sem gerador de imagem conectado</b> — os sete estilos continuam
    disponíveis, e a ordem abaixo é o que aguenta melhor este caminho. Cada um aparece em
    três composições: é o que quebra no card 5, não na capa.</div></div>

<div class="faixa"><div class="faixa-cab"><h2>Feitos para este caminho</h2>
  <span>Ficam inteiros sem gerador nenhum.</span></div>
  ${est(3,'terminal','Terminal','Paleta de editor de código sobre chumbo, grade de caractere e muito vazio. <b>Nasce sem foto</b> — o desenho já é o material.')}
  ${est(7,'superminimal','Superminimal','Branco, preto, e a imagem entrando como bloco chapado. Nenhum grafismo em volta. <b>Com as suas fotos é o mais forte deste catálogo</b> — recorte limpo cai direto no branco, sem tratamento. Sem imagem nenhuma fica magro: aqui a foto é o evento.')}
  ${est(1,'brutalista','Brutalista vetorial','Forma chapada de aresta dura sobre papel cru, tipografia condensada como material. <b>A foto é acessório</b> aqui: entra na capa e sai do miolo sem prejuízo.')}
</div>

<div class="faixa"><div class="faixa-cab"><h2>Também funcionam bem</h2>
  <span>Com um custo dito na hora, não descoberto na entrega.</span></div>
  ${est(5,'neubrutal','Neo-brutalismo colorido','Contorno preto grosso e sombra dura sobre campo saturado. <em>Acerta fácil e envelhece rápido — é o visual mais usado em post de design hoje.</em>')}
  ${est(6,'editorial','Minimalista editorial quente','Duas colunas, serifa de contraste alto, e muito vazio. <em>Pede uma imagem grande e boa — uma, não oito.</em>')}
</div>

<div class="faixa aviso"><div class="faixa-cab"><h2>Aqui eles perdem</h2>
  <span><b style="color:#E0521C">A escolha continua sendo sua</b> — mas sem gerador estes dois
  saem na versão reduzida, e é justo você saber antes.</span></div>
  ${est(2,'riso','Risografia com textura','Duas tintas que se multiplicam, erro de registro, retícula e fibra. <em>A tinta riso existe para cair sobre imagem: sem foto, a retícula vira desenho de retícula.</em>')}
  ${est(4,'colagem','Mixed media · colagem','Camadas de origens diferentes, toda emenda à mostra. <em>O recorte fotográfico é o centro do estilo: sem foto, sobra a emenda sem o que emendar.</em>')}
</div>
${PROPRIA}${CTA}
<div class="pe"><span>um-carrossel-por-favor</span><span>sete estilos fixos · três composições cada</span></div>`;

const B = `
<div class="top"><h1>catálogo<i>.</i></h1>
  <div class="sub"><b>Com gerador de imagem conectado</b> — os sete em pé de igualdade. A imagem
    de cada card nasce sob medida para o seu assunto, então não há estilo que fique devendo.
    Escolha por gosto. Cada um aparece em três composições.</div></div>

<div class="faixa"><div class="faixa-cab"><h2>Os sete</h2>
  <span>Dois deles <b>mudam de patamar</b> com o gerador ligado — a risografia e a colagem —,
    porque a foto é o centro dos dois.</span></div>
  ${est(1,'brutalista','Brutalista vetorial','Forma chapada de aresta dura sobre papel cru, tipografia condensada como material.')}
  ${est(2,'riso','Risografia com textura','Duas tintas que se multiplicam, erro de registro, retícula e fibra. <b>Muda de patamar aqui.</b>')}
  ${est(3,'terminal','Terminal','Paleta de editor de código sobre chumbo, grade de caractere e muito vazio.')}
  ${est(4,'colagem','Mixed media · colagem','Camadas de origens diferentes, toda emenda à mostra. <b>Muda de patamar aqui.</b>')}
  ${est(5,'neubrutal','Neo-brutalismo colorido','Contorno preto grosso e sombra dura sobre campo saturado. <em>Acerta fácil e envelhece rápido.</em>')}
  ${est(6,'editorial','Minimalista editorial quente','Duas colunas, serifa de contraste alto, e muito vazio.')}
  ${est(7,'superminimal','Superminimal','Branco, preto, e a imagem entrando como bloco chapado. Nenhum grafismo em volta.')}
</div>
${PROPRIA}${CTA}
<div class="pe"><span>um-carrossel-por-favor</span><span>sete estilos fixos · três composições cada</span></div>`;

document.getElementById('root').innerHTML =
  new URLSearchParams(location.search).get('c') === 'b' ? B : A;

document.fonts.ready.then(()=>setTimeout(()=>{
  document.title = 'ALT=' + document.body.scrollHeight;
}, 200));
</script>
